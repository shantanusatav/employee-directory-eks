apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-directory
  labels:
    app: employee-directory
spec:
  # 1 replica because the demo uses a simple per-pod SQLite database
  replicas: 1
  selector:
    matchLabels:
      app: employee-directory
  template:
    metadata:
      labels:
        app: employee-directory
    spec:
      containers:
        - name: employee-directory
          # GitHub Actions rewrites this line with each new image tag
          image: AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/employee-directory:v1
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
